name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # upx does not support Mach-O (macOS) — Linux ELF targets only.
          - target: x86_64-unknown-linux-gnu
            upx: true
          - target: x86_64-unknown-linux-musl
            upx: true
          - target: aarch64-unknown-linux-gnu
            upx: true
          - target: aarch64-unknown-linux-musl
            upx: true
          - target: x86_64-apple-darwin
            upx: false
          - target: aarch64-apple-darwin
            upx: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Installs cargo-zigbuild plus the matching zig toolchain (ziglang wheel).
      - name: Install cargo-zigbuild
        run: python -m pip install cargo-zigbuild

      - name: Build
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}

      # install-action no longer ships upx; install the official static
      # binary from GitHub releases instead (pinned version).
      - name: Install upx
        if: matrix.upx
        run: |
          curl -sL https://github.com/upx/upx/releases/download/v5.0.1/upx-5.0.1-amd64_linux.tar.xz -o /tmp/upx.tar.xz
          mkdir -p /tmp/upx && tar -xJf /tmp/upx.tar.xz -C /tmp/upx --strip-components=1
          sudo install -m 755 /tmp/upx/upx /usr/local/bin/upx
          upx --version

      - name: Stage binary
        run: cp "target/${{ matrix.target }}/release/netdiscover" "netdiscover-${{ matrix.target }}"

      - name: Compress with upx
        if: matrix.upx
        run: |
          upx --version
          upx --best --lzma "netdiscover-${{ matrix.target }}"

      # Musl static x86_64 runs natively on the ubuntu runner; proves the
      # upx-packed binary still self-extracts and executes.
      - name: Smoke test packed binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: "./netdiscover-x86_64-unknown-linux-musl -h"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netdiscover-${{ matrix.target }}
          path: netdiscover-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum netdiscover-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
