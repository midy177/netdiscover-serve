name: Release

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: netdiscover-serve

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # upx does not support Mach-O (macOS) — Linux ELF targets only.
          - target: x86_64-unknown-linux-gnu
            upx: true
          - target: x86_64-unknown-linux-musl
            upx: true
          - target: aarch64-unknown-linux-gnu
            upx: true
          - target: aarch64-unknown-linux-musl
            upx: true
          - target: x86_64-apple-darwin
            upx: false
          - target: aarch64-apple-darwin
            upx: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Installs cargo-zigbuild plus the matching zig toolchain (ziglang wheel).
      - name: Install cargo-zigbuild
        run: python -m pip install cargo-zigbuild

      - name: Build
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}

      # install-action no longer ships upx; install the official static
      # binary from GitHub releases instead (pinned version).
      - name: Install upx
        if: matrix.upx
        run: |
          curl -sL https://github.com/upx/upx/releases/download/v5.0.1/upx-5.0.1-amd64_linux.tar.xz -o /tmp/upx.tar.xz
          mkdir -p /tmp/upx && tar -xJf /tmp/upx.tar.xz -C /tmp/upx --strip-components=1
          sudo install -m 755 /tmp/upx/upx /usr/local/bin/upx
          upx --version

      - name: Stage binary
        run: cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${BINARY_NAME}-${{ matrix.target }}"

      - name: Compress with upx
        if: matrix.upx
        run: |
          upx --version
          upx --best --lzma "${BINARY_NAME}-${{ matrix.target }}"

      # Musl static x86_64 runs natively on the ubuntu runner; proves the
      # upx-packed binary still self-extracts and executes.
      - name: Smoke test packed binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: "./${BINARY_NAME}-x86_64-unknown-linux-musl -h"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          if-no-files-found: error

  image:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: docker-image

      - name: Install cargo-zigbuild
        run: python -m pip install cargo-zigbuild

      - name: Build Docker binaries
        run: |
          cargo zigbuild --locked --release --target x86_64-unknown-linux-musl
          cargo zigbuild --locked --release --target aarch64-unknown-linux-musl
          mkdir -p dist/docker
          cp "target/x86_64-unknown-linux-musl/release/${BINARY_NAME}" "dist/docker/${BINARY_NAME}-amd64"
          cp "target/aarch64-unknown-linux-musl/release/${BINARY_NAME}" "dist/docker/${BINARY_NAME}-arm64"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, image]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ${BINARY_NAME}-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
